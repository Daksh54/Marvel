version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: quickshow-redis
    ports:
      - "6379:6379"
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickshow-app
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=5000
    depends_on:
      - redis
    restart: always
